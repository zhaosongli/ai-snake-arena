<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小蛇运动会 · AI 贪吃蛇</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#18344a;background:#eff9fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 8%,#fff5c8,transparent 35%),radial-gradient(circle at 85% 90%,#c9f4e6,transparent 40%),#eff9fb}.wrap{max-width:1140px;margin:auto;padding:24px 16px 40px}header{text-align:center}h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:.04em}header p{margin:8px 0 22px;color:#527083;font-size:16px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}.card{background:#fff;border:3px solid #d5eee9;border-radius:24px;box-shadow:0 9px 0 #cbe9e3,0 20px 35px #175e6940;padding:14px}.game-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 5px 12px;font-weight:800}.live{color:#ec6d77}.dot{display:inline-block;width:10px;height:10px;background:#f26b7e;border-radius:50%;margin-right:6px;box-shadow:0 0 0 4px #ffe7ec}.board{width:100%;display:block;border-radius:15px;background:#dff4e8;touch-action:manipulation}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.controls button{border:0;border-radius:15px;padding:12px 18px;font:800 16px inherit;cursor:pointer;min-height:48px;color:#163c4a;background:#e1f6ed;box-shadow:0 4px 0 #b6dcd0;transition:transform .1s}.controls button:hover{transform:translateY(-2px)}.controls button:active{transform:translateY(3px);box-shadow:0 1px 0 #b6dcd0}.controls .primary{background:#ffdc72;box-shadow:0 4px 0 #dfb95b}.controls button:focus-visible{outline:3px solid #287cab;outline-offset:3px}.hint{font-size:14px;color:#557487;margin:14px 4px 3px;line-height:1.6}.sidebar h2{font-size:20px;margin:4px 4px 12px}.score{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:12px;background:#f2faf7;margin:5px 0;font-weight:700}.score:first-of-type{background:#fff4cc}.badge{width:13px;height:13px;flex:none;border-radius:50%;border:2px solid #ffffffaa}.name{flex:1}.number{color:#557487;font-variant-numeric:tabular-nums}.status{font-size:13px;color:#718a96}.rule{margin-top:18px;padding:12px;border-radius:14px;background:#eaf6ff;line-height:1.6;font-size:14px}.rule strong{display:block;font-size:16px}.event{margin:13px 4px 2px;color:#526b7e;font-size:14px;min-height:42px;line-height:1.5}@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}.sidebar h2,.rule,.event{grid-column:1/-1}.score{margin:3px 0}.wrap{padding:16px 10px 30px}.card{padding:10px;border-radius:18px}.controls button{flex:1}}
</style>
</head>
<body><main class="wrap"><header><h1>🐍 小蛇运动会</h1><p>3 条不同颜色的小蛇，每条只有一个蛇头，谁先长到 30 格谁赢！</p></header><div class="layout"><section class="card" aria-label="AI 小蛇比赛"><div class="game-top"><span class="live"><i class="dot" aria-hidden="true"></i><span id="gameState">比赛进行中</span></span><span id="clock">第 0 回合</span></div><canvas id="board" width="768" height="576" class="board" role="img" aria-label="三条不同颜色的 AI 小蛇比赛场地，排名在右侧显示"></canvas><div class="controls"><button id="pause" class="primary" type="button">⏸ 暂停</button><button id="speed" type="button">🚶 速度：普通</button><button id="reset" type="button">🔄 重新比赛</button></div><p class="hint">彩色长条是小蛇，彩色圆点是水果。小蛇自己会玩，你可以暂停、调速度或重新比赛。</p></section><aside class="card sidebar"><h2>🏆 长度排行榜</h2><div id="scores" aria-live="off"></div><div class="rule"><strong>怎么玩？</strong>🐍 3 条小蛇各有一个蛇头。蛇头碰到自己的身体，就咬一口、长 2 格，身体不断开！<br>🍎 吃自己颜色的水果长 2 格；吃其他颜色长 1 格。<br>💥 大蛇碰到小蛇，小蛇变成它自己颜色的水果；碰到不比自己小的蛇会出局，稍后回来。<br>🏆 先长到 30 格的小蛇获胜！</div><div class="event" id="event" aria-live="polite">比赛开始啦！为喜欢的小蛇加油！</div></aside></div></main>
<script>
'use strict';
(() => {
  const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
  const W=24,H=18,S=32,FOOD_COUNT=22,WIN_LENGTH=30;
  const colors=['#ff777f','#48b9e4','#ffa346'];
  const names=['草莓','蓝蓝','橘子'];
  const directions=[{x:1,y:0},{x:0,y:1},{x:-1,y:0},{x:0,y:-1}];
  const key=p=>`${p.x},${p.y}`;
  const inside=p=>p.x>=0&&p.y>=0&&p.x<W&&p.y<H;
  const rand=n=>Math.floor(Math.random()*n);
  let snakes=[],foods=[],turn=0,paused=false,speedIndex=1,timer=null,winner=null,bites=0;
  const speeds=[300,185,110],speedLabels=['慢慢走','普通','飞快跑'];
  const scoreEl=document.getElementById('scores'),eventEl=document.getElementById('event');
  function occupied(){return new Set(snakes.flatMap(s=>s.body.map(key)));}
  function freeCell(minDistance=0){
    const blocked=occupied(),foodKeys=new Set(foods.map(key));
    const candidates=[];
    for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
      if(blocked.has(`${x},${y}`)||foodKeys.has(`${x},${y}`))continue;
      if(snakes.some(s=>s.body.length&&Math.abs(s.body[0].x-x)+Math.abs(s.body[0].y-y)<minDistance))continue;
      candidates.push({x,y});
    }
    return candidates.length?candidates[rand(candidates.length)]:null;
  }
  function addFood(color=colors[rand(colors.length)]){const p=freeCell();if(p)foods.push({...p,color});}
  function spawn(s){
    const blocked=occupied(),foodKeys=new Set(foods.map(key));
    for(let attempt=0;attempt<100;attempt++){
      const p={x:5+rand(W-10),y:5+rand(H-10)},dir=directions[rand(4)];
      const body=Array.from({length:6},(_,i)=>({x:p.x-dir.x*i,y:p.y-dir.y*i}));
      if(body.some(q=>!inside(q)||blocked.has(key(q))||foodKeys.has(key(q))))continue;
      if(snakes.some(other=>other.body.length&&Math.abs(other.body[0].x-p.x)+Math.abs(other.body[0].y-p.y)<5))continue;
      s.body=body;s.dir=dir;s.wait=0;s.pending=0;return true;
    }
    return false;
  }
  function reset(){
    clearInterval(timer);turn=0;foods=[];paused=false;speedIndex=1;winner=null;bites=0;
    snakes=names.map((name,i)=>({name,color:colors[i],body:[],dir:directions[i%4],score:0,wait:0,pending:0,bites:0}));
    snakes.forEach(spawn);
    for(let i=0;i<FOOD_COUNT;i++)addFood(colors[i%colors.length]);
    eventEl.textContent='比赛开始啦！为喜欢的小蛇加油！';
    syncButtons();render();startTimer();
  }
  function riskArea(start,blocked){
    // Avoid chasing food into a tiny dead end.
    const seen=new Set([key(start)]),queue=[start];
    for(let i=0;i<queue.length&&queue.length<45;i++)for(const d of directions){
      const q={x:queue[i].x+d.x,y:queue[i].y+d.y},k=key(q);
      if(inside(q)&&!blocked.has(k)&&!seen.has(k)){seen.add(k);queue.push(q);}
    }
    return queue.length;
  }
  function choose(s){
    const head=s.body[0],blocked=occupied(),own=new Set(s.body.map(key));
    // A bite touches the body without moving the head onto an occupied square.
    // This keeps exactly one head and a continuous, non-overlapping body.
    if(turn%8===0&&s.body.length<WIN_LENGTH){
      const bite=directions.find(d=>s.body.slice(2,-1).some(q=>q.x===head.x+d.x&&q.y===head.y+d.y));
      if(bite)return {bite:true};
    }
    if(!s.pending)blocked.delete(key(s.body[s.body.length-1]));
    const options=[];
    for(const d of directions){
      if(d.x===-s.dir.x&&d.y===-s.dir.y)continue;
      const p={x:head.x+d.x,y:head.y+d.y},k=key(p);
      const fruitHere=foods.some(f=>key(f)===k);
      if(!inside(p)||own.has(k)&&(k!==key(s.body[s.body.length-1])||s.pending||fruitHere))continue;
      const rival=snakes.find(other=>other!==s&&other.body.some(q=>key(q)===k));
      if(rival&&rival.body.length>=s.body.length)continue;
      if(blocked.has(k)&&!rival)continue;
      const distance=Math.min(...foods.map(f=>Math.abs(f.x-p.x)+Math.abs(f.y-p.y)-(f.color===s.color?1.5:0)));
      const safe=new Set(blocked);
      if(rival)rival.body.forEach(q=>safe.delete(key(q)));
      const area=riskArea(p,safe);
      const edge=Math.min(p.x,W-1-p.x,p.y,H-1-p.y);
      options.push({d,p,value:-distance*2+Math.min(area,24)*.26+Math.min(edge,3)*.28+Math.random()*1.7-(area<8?18:0)+(rival?15:0)});
    }
    options.sort((a,b)=>b.value-a.value);
    return options[0]||null;
  }
  function dropSnake(s,message){
    const old=s.body;s.body=[];s.score=0;s.wait=8;s.pending=0;
    const blocked=occupied(),fruit=new Set(foods.map(key));
    for(const p of old)if(!blocked.has(key(p))&&!fruit.has(key(p))){foods.push({...p,color:s.color});fruit.add(key(p));}
    eventEl.textContent=message;
  }
  function growTail(s){
    while(s.pending>0){
      const tail=s.body[s.body.length-1],prev=s.body[s.body.length-2];
      const candidates=[{x:tail.x+(tail.x-prev.x),y:tail.y+(tail.y-prev.y)},...directions.map(d=>({x:tail.x+d.x,y:tail.y+d.y}))];
      const blocked=occupied(),fruit=new Set(foods.map(key));
      const extra=candidates.find(p=>inside(p)&&!blocked.has(key(p))&&!fruit.has(key(p)));
      if(!extra)break;
      s.body.push(extra);s.pending--;
    }
  }
  function tick(){
    if(winner)return;
    turn++;
    for(const s of snakes){
      if(!s.body.length){if(s.wait>0)s.wait--;else spawn(s);continue;}
      const move=choose(s);
      if(!move){dropSnake(s,`💫 ${s.name}没路走啦，等会儿再来！`);continue;}
      if(move.bite){
        bites++;s.bites++;s.score+=2;s.pending+=2;growTail(s);
        eventEl.textContent=`🐍 ${s.name}咬到自己的身体，长 2 格！现在 ${s.body.length} 格。`;
      }else{
        const rival=snakes.find(other=>other!==s&&other.body.some(q=>key(q)===key(move.p)));
        if(rival){
          if(s.body.length>rival.body.length)dropSnake(rival,`🐍 ${s.name}比${rival.name}大！${rival.name}变成水果啦！`);
          else {dropSnake(s,`💫 ${s.name}碰到更大的蛇，变成水果啦！`);continue;}
        }
        s.dir=move.d;
        const keepsTail=s.pending>0||foods.some(f=>key(f)===key(move.p));
        if(s.body.slice(0,keepsTail?undefined:-1).some(q=>key(q)===key(move.p))){
          // Touch the body without creating an overlapping second head.
          bites++;s.bites++;s.score+=2;s.pending+=2;growTail(s);
          eventEl.textContent=`🐍 ${s.name}咬到自己的身体，长 2 格！`;
        }else{
          s.body.unshift(move.p);
          const foodAt=foods.findIndex(f=>key(f)===key(move.p));
          let gained=0;
          if(foodAt>=0){
            const fruit=foods.splice(foodAt,1)[0];
            gained=fruit.color===s.color?2:1;
            s.score+=gained;s.pending+=gained;
          }
          if(s.pending>0)s.pending--;
          else s.body.pop();
          growTail(s);
          if(gained)eventEl.textContent=`🍎 ${s.name}吃到${gained===2?'自己颜色':'其他颜色'}的水果，长了 ${gained} 格！现在 ${s.body.length} 格。`;
        }
      }
      if(s.body.length>=WIN_LENGTH){winner=s.name;paused=true;clearInterval(timer);eventEl.textContent=`🏆 ${s.name}赢啦！它长到了 ${s.body.length} 格！点「重新比赛」再玩一次。`;break;}
    }
    while(foods.length<FOOD_COUNT){const before=foods.length;addFood();if(foods.length===before)break;}
    syncButtons();render();
  }
  function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
  function draw(){
    ctx.fillStyle='#e4f4e8';ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)if((x+y)%2===0){ctx.fillStyle='#d9efdf';ctx.fillRect(x*S,y*S,S,S);}
    for(const f of foods){
      const x=f.x*S+S/2,y=f.y*S+S/2;
      ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(x,y+2,10,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#57a867';ctx.beginPath();ctx.ellipse(x+4,y-9,5,3,-.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff9';ctx.beginPath();ctx.arc(x-2,y,2,0,Math.PI*2);ctx.fill();
    }
    for(const s of snakes){s.body.forEach((p,i)=>{
      const x=p.x*S,y=p.y*S;
      roundRect(x+2,y+2,S-4,S-4,i===0?12:10,s.color);
      if(i===0){
        const d=s.dir,perp={x:-d.y,y:d.x};
        for(const side of [-1,1]){
          const ex=x+S/2+d.x*6+perp.x*side*7,ey=y+S/2+d.y*6+perp.y*side*7;
          ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,4.3,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='#233c47';ctx.beginPath();ctx.arc(ex+d.x,ey+d.y,2,0,Math.PI*2);ctx.fill();
        }
      }else if(i%2===0)roundRect(x+12,y+12,8,8,4,'#ffffff77');
    });}
    if(paused){ctx.fillStyle='#173c4a88';ctx.fillRect(0,0,canvas.width,canvas.height);roundRect(184,230,400,116,24,'#fff');ctx.fillStyle='#23475a';ctx.textAlign='center';ctx.font='bold 34px system-ui';ctx.fillText(winner?`🏆 ${winner}赢啦！`:'⏸ 比赛暂停啦',384,296);}
  }
  function render(){
    draw();document.getElementById('clock').textContent=`第 ${turn} 回合`;
    const ranking=[...snakes].sort((a,b)=>b.body.length-a.body.length||names.indexOf(a.name)-names.indexOf(b.name));
    scoreEl.replaceChildren(...ranking.map((s,i)=>{
      const row=document.createElement('div');row.className='score';
      const rank=document.createElement('span');rank.textContent=i===0?'👑':`${i+1}.`;
      const badge=document.createElement('span');badge.className='badge';badge.style.background=s.color;
      const name=document.createElement('span');name.className='name';name.textContent=s.name+(s.body.length?'':' 💤');
      const points=document.createElement('span');points.className='number';points.textContent=`${s.body.length} 格`;
      row.append(rank,badge,name,points);return row;
    }));
  }
  function syncButtons(){document.getElementById('pause').textContent=winner?'🏆 已结束':paused?'▶ 继续':'⏸ 暂停';document.getElementById('pause').disabled=!!winner;document.getElementById('speed').textContent=`🚶 速度：${speedLabels[speedIndex]}`;document.getElementById('gameState').textContent=winner?'比赛结束':paused?'比赛暂停中':'比赛进行中';}
  function startTimer(){clearInterval(timer);if(!paused&&!winner)timer=setInterval(tick,speeds[speedIndex]);}
  document.getElementById('pause').addEventListener('click',()=>{if(winner)return;paused=!paused;syncButtons();startTimer();render();});
  document.getElementById('speed').addEventListener('click',()=>{speedIndex=(speedIndex+1)%speeds.length;syncButtons();startTimer();});
  document.getElementById('reset').addEventListener('click',reset);
  // Read-only snapshot and deterministic stepping for automated checks.
  window.__arena={snapshot:()=>({turn,paused,winner,bites,speed:speedLabels[speedIndex],snakes:snakes.map(s=>({name:s.name,color:s.color,score:s.score,bites:s.bites,pending:s.pending,length:s.body.length,wait:s.wait,body:s.body.map(p=>({...p}))})),foods:foods.map(p=>({...p}))}),step:tick,reset};
  reset();
})();
</script></body></html>
